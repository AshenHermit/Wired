name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Ветка или тег для деплоя (по умолчанию main)
        required: false
        default: main
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Проверки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Установить зависимости
        run: pnpm install --frozen-lockfile

      - name: Собрать общие типы
        run: pnpm build:shared

      - name: Тесты сервера
        run: pnpm --filter server test

      - name: Тесты фронтенда
        run: pnpm --filter frontend test

      - name: Типы фронтенда
        run: pnpm check-types:frontend

  deploy:
    name: Деплой
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/Wired' }}
      PROD_ENV: ${{ secrets.PROD_ENV }}
      # Ручной запуск с ветки не должен уезжать в прод незаметно: по умолчанию main.
      DEPLOY_REF: ${{ inputs.ref || 'main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Настроить SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Проверить каталог деплоя
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "$(printf 'DEPLOY_PATH=%q bash -s' "$DEPLOY_PATH")" <<'REMOTE'
          set -euo pipefail
          hint="sudo chown -R $(id -un) $DEPLOY_PATH"
          if ! mkdir -p "$DEPLOY_PATH" 2>/dev/null; then
            printf '[deploy] ОШИБКА: нет прав создать %s; выполните: %s\n' "$DEPLOY_PATH" "$hint" >&2
            exit 2
          fi
          if [ ! -w "$DEPLOY_PATH" ] || { [ -e "$DEPLOY_PATH/.env" ] && [ ! -w "$DEPLOY_PATH/.env" ]; }; then
            printf '[deploy] ОШИБКА: нет прав на запись в %s; выполните: %s\n' "$DEPLOY_PATH" "$hint" >&2
            exit 2
          fi
          REMOTE

      - name: Записать .env на сервер
        run: |
          set -euo pipefail
          env_file=$(printf %q "$DEPLOY_PATH/.env")
          printf '%s\n' "$PROD_ENV" | ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "umask 077 && cat > $env_file"

      - name: Собрать и пересоздать контейнеры
        run: |
          set -euo pipefail
          ref=$(printf %q "$DEPLOY_REF")
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH=$(printf %q "$DEPLOY_PATH") bash -s -- $ref" \
            < scripts/deploy-remote.sh
