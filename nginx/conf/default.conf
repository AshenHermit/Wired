# Map для правильной обработки Connection header для WebSocket
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream wired_frontend_upstream {
  server frontend:3000;
}

upstream wired_backend_upstream {
  server backend:3000;
}

server {
    listen 8080;
    server_name ~^wired\..+$;

    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;

    location / {
        try_files $uri $uri/ @nextjs;
    }

    location @nextjs {
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_pass http://wired_frontend_upstream;
        proxy_cookie_path / "/; HTTPOnly; Secure";
    }
}

server {
    listen 8080;
    server_name ~^api\.wired\..+$;

    server_tokens off;

    location / {
      proxy_pass http://wired_backend_upstream;
      proxy_http_version 1.1;
      
      # WebSocket support
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
      # WebSocket specific settings
      proxy_cache_bypass $http_upgrade;
      proxy_buffering off;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }
}

